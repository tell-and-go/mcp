# Publishes registry/server.json to the Official MCP Registry as
# io.github.tell-and-go/mcp. The registry grants the io.github.tell-and-go/*
# namespace to GitHub Actions OIDC tokens from repos this org owns; the
# interactive GitHub login only ever grants the publisher's personal namespace.
# Run manually after a version bump in registry/server.json.
name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # This job can mint the registry OIDC token, so the binary is checked before it is unpacked.
      # The hash is the release's own: registry_1.8.1_checksums.txt and the asset digest on v1.8.1.
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check --strict -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Log in with GitHub Actions OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        working-directory: registry
        run: ../mcp-publisher publish
